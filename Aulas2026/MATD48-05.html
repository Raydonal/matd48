class: inverse, center, middle

# Bloco 1 — Teoria

---

## Submuestreo: dois níveis de erro

Quando uma unidade experimental (UE) é medida `\(q\)` vezes (submuestras), o modelo ganha um segundo
termo de erro:

`$$Y_{ijk} = \mu + \tau_i + \delta_{ij} + \varepsilon_{ijk}$$`

- `\(\delta_{ij}\sim N(0,\sigma_\delta^2)\)`: erro **experimental** (entre UEs).
- `\(\varepsilon_{ijk}\sim N(0,\sigma_\varepsilon^2)\)`: erro de **amostragem** (entre submuestras).
- `\(i=1,\ldots,t\)`; `\(j=1,\ldots,r\)` UEs por tratamento; `\(k=1,\ldots,q\)` submuestras por UE.

--

Só `\(\sigma_\delta^2\)` importa para comparar tratamentos — mais submuestras **não** criam novas UEs
(Cochran &amp; Cox, 1957).

---

## Notação matricial: por que `\(\sigma^2\mathbf{I}\)` não basta

Empilhando as `\(N=trq\)` observações em `\(\mathbf{Y}\)` (Capítulo 2), o submuestreo quebra a suposição
de erros i.i.d.:

`$$\mathrm{Cov}(\mathbf{Y}) = \mathbf{V} = \sigma_\delta^2\,\mathbf{Z}\mathbf{Z}' + \sigma_\varepsilon^2\mathbf{I}_N$$`

- `\(\mathbf{Z}\)`: matriz `\(N\times tr\)` de indicadores de UE — `\(Z_{[ijk],\,i'j'}=\mathbb 1\{i=i',j=j'\}\)`.
- `\(\mathbf{Z}\mathbf{Z}'\)` tem blocos de `\(1\)`'s do tamanho `\(q\times q\)` (submuestras da mesma UE):
  observações da mesma UE são correlacionadas, `\(\mathrm{Cov}(Y_{ijk},Y_{ijk'})=\sigma_\delta^2\)`.
- `\(\mathbf{V}\)` tem estrutura de **simetria composta** por bloco — logo a suposição
  `\(\mathrm{Cov}=\sigma^2\mathbf{I}\)` do teorema de Gauss-Markov (Cap. 2) **está violada**.

--

Violada a hipótese, o teorema não se aplica. Mas isso significa que precisamos de GLS aqui?

---

## Zyskind outra vez: e o balanceamento deixa de ser detalhe

Da Aula 03: com `\(\mathrm{Cov}(\boldsymbol\varepsilon)=\mathbf V\)`, o MQO continua BLUE **se e somente se** existe `\(\mathbf Q\)` com `\(\mathbf{V}\mathbf{X}=\mathbf{X}\mathbf{Q}\)`. Vamos testar.


``` r
t_ &lt;- 3; r &lt;- 2; q &lt;- 4                      # desenho BALANCEADO
ue   &lt;- factor(rep(1:(t_ * r), each = q))
trat &lt;- factor(rep(rep(1:t_, each = r), each = q))
X &lt;- model.matrix(~ trat);  Z &lt;- model.matrix(~ ue - 1)

s_d &lt;- 1.7; s_e &lt;- 0.9
V &lt;- s_d^2 * Z %*% t(Z) + s_e^2 * diag(nrow(Z))
Q &lt;- qr.solve(X, V %*% X)

c(max_erro = max(abs(V %*% X - X %*% Q)),
  constante = Q[1, 1], q_sd2_mais_se2 = q * s_d^2 + s_e^2)
```

```
##       max_erro      constante q_sd2_mais_se2 
##   1.065814e-14   1.237000e+01   1.237000e+01
```

--

A condição **se verifica**, e com `\(\mathbf{Q}=(q\sigma_\delta^2+\sigma_\varepsilon^2)\mathbf{I}\)`. Apesar da correlação dentro de UE, **MQO continua ótimo** — é por isso que a ANOVA agregada funciona, e não por aproximação.

---

## O que acontece se o desenho desbalancear


``` r
q2   &lt;- c(4, 4, 4, 4, 4, 2)                  # uma UE com 2 submostras em vez de 4
ue2   &lt;- factor(rep(1:6, times = q2))
trat2 &lt;- factor(rep(rep(1:3, each = 2), times = q2))
X2 &lt;- model.matrix(~ trat2); Z2 &lt;- model.matrix(~ ue2 - 1)
V2 &lt;- s_d^2 * Z2 %*% t(Z2) + s_e^2 * diag(nrow(Z2))

max(abs(V2 %*% X2 - X2 %*% qr.solve(X2, V2 %*% X2)))
```

```
## [1] 3.853333
```

--

A condição **falha**. Com submuestragem desigual, MQO deixa de ser BLUE e a estimação correta passa por GLS / máxima verossimilhança restrita (`lme4`, `nlme`).

--

Guarde isto: **o balanceamento não é preferência estética nem comodidade de cálculo.** É o que compra o direito de analisar um desenho hierárquico com a ferramenta mais simples. Perder o balanceamento custa um teorema.

---

## O sintoma na prática: `aov()` quebra, `lmer()` não


``` r
set.seed(77)
delta2 &lt;- rnorm(6, 0, s_d)
dados_desbal &lt;- map_dfr(1:6, function(i) {
  tibble(ue = factor(i), trat = factor(rep(1:3, each = 2)[i]),
         y = 10 + 2 * rep(1:3, each = 2)[i] + delta2[i] + rnorm(q2[i], 0, s_e))
})
```


``` r
m_aov &lt;- aov(y ~ trat + Error(trat:ue), data = dados_desbal)
```

```
## Warning in aov(y ~ trat + Error(trat:ue), data = dados_desbal): Error() model
## is singular
```

--

O aviso **"Error() model is singular"** não é cosmético — é o R avisando que a separação em
estratos (a mesma conta do Zyskind, por baixo dos panos) não fecha sem balanceamento. Continuar e
ler o `summary()` mesmo assim seria confiar num teste que a própria função avisa não ser válido.

---

## A ferramenta certa: `lme4::lmer()`


``` r
m_lmer &lt;- lme4::lmer(y ~ trat + (1 | ue), data = dados_desbal)
lme4::VarCorr(m_lmer)   # sigma_delta^2 e sigma_epsilon^2 estimados por REML, sem exigir balanceamento
```

```
##  Groups   Name        Std.Dev.
##  ue       (Intercept) 0.71141 
##  Residual             0.98280
```

``` r
anova(m_lmer)           # teste F de tratamento -- sem p-valor aqui: exige aproximar os gl do denominador
```

```
## Analysis of Variance Table
##      npar Sum Sq Mean Sq F value
## trat    2 29.689  14.845  15.369
```

Nenhum aviso, nenhuma singularidade: `lmer()` estima os dois componentes de variância por máxima
verossimilhança restrita, que não depende da decomposição algébrica em estratos ortogonais que
`aov()` exige. O preço é interpretativo, não computacional — os graus de liberdade do teste `\(F\)`
deixam de ter uma fórmula fechada simples e exigem uma aproximação (Satterthwaite ou
Kenward-Roger, fora do escopo deste curso) em vez do `\(F_{t(r-1)}\)` exato da tabela balanceada.

---

## ANOVA com submuestreo

&lt;table class="table" style="font-size: 18px; width: auto !important; margin-left: auto; margin-right: auto;"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Fonte &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Gl &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; E[QM] &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Tratamento &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; t - 1 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ²_ε + qσ²_δ + qr Στ²/(t-1) &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Erro experimental &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; t(r-1) &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ²_ε + qσ²_δ &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Erro de amostragem &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; tr(q-1) &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ²_ε &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Total &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; trq - 1 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt;  &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

Teste correto: `\(F = MS_{\text{Trat}}/MS_{\text{erro experimental}}\)` — **não** o erro de
amostragem. Usar o erro de amostragem no denominador é pseudorreplicação (Aula 01/Capítulo 1):
infla `\(F\)` e a taxa de falso positivo.

---

## Modelo de efeitos aleatórios

Quando os níveis do fator são uma **amostra aleatória** de uma população maior de níveis (não os
níveis de interesse *per se*):

`$$Y_{ij} = \mu + \tau_i + \varepsilon_{ij}, \qquad \tau_i\overset{iid}{\sim}N(0,\sigma_\tau^2)$$`

- `\(H_0:\sigma_\tau^2=0\)` em vez de "as médias são iguais".
- `\(\text{Corr}(Y_{ij},Y_{ij'}) = \sigma_\tau^2/(\sigma_\tau^2+\sigma^2)\)` = ICC.
- Mesma tabela de ANOVA, mas `\(E[MS_{\text{Entre}}] = \sigma^2+n\sigma_\tau^2\)` (não envolve `\(\tau_i\)`
  individuais) `\(\Rightarrow \hat\sigma_\tau^2 = (MS_{\text{Entre}}-MS_E)/n\)`, o estimador de
  momentos clássico para componentes de variância (Montgomery, 2017).

--

Em notação matricial, a mesma estrutura de simetria composta reaparece,
`\(\mathbf{V}=\sigma_\tau^2\mathbf{Z}\mathbf{Z}'+\sigma^2\mathbf{I}_N\)`, agora com `\(\mathbf{Z}\)`
indicando o **nível sorteado** (não a UE): submuestreo e efeitos aleatórios são duas instâncias
do mesmo fenômeno — observações que compartilham um rótulo aleatório deixam de ser independentes.

---

## Três formas de organizar o mesmo experimento

Mesmas 12 plantas, 3 tratamentos, adaptado de Hinkelmann &amp; Kempthorne (1994):

&lt;img src="assets/images/experimento1.png" alt="" width="31%" /&gt;&lt;img src="assets/images/sit2.png" alt="" width="31%" /&gt;&lt;img src="assets/images/sit3.png" alt="" width="31%" /&gt;

--

**Situação 1**: 1 caixa/tratamento — só **3 UEs no total**, zero gl de erro entre UEs. Fatal.
**Situação 2**: 12 vasos individuais — sem submuestreo, 9 gl de erro. **Situação 3**: 2
caixas/tratamento — submuestreo, mas com 2 UEs/tratamento (3 gl de erro) em vez de 1. É a mesma
estrutura, em miniatura, do exemplo da tilápia a seguir.

---

## Agricultura: probiótico e ganho de peso em tilápia

**Dados reais** (`mojarra.csv`): 4 probióticos, 20 aquários (5 por probiótico), ~5 peixes por
aquário medidos individualmente.

- **UE = aquário** (o probiótico é misturado à ração de todo o aquário).
- **Unidade amostral = peixe** (submuestra).


``` r
mojarra &lt;- read_csv("../Livro/data/mojarra.csv", show_col_types = FALSE) %&gt;%
  rename(probiotico = probiotico, aquario = Acuario,
         peso_inicial = `Peso Inicial`, peso_45 = `Peso 45`) %&gt;%
  drop_na(peso_45) %&gt;%
  mutate(probiotico = factor(probiotico), aquario = factor(aquario),
         ganho = peso_45 - peso_inicial)
nrow(mojarra); n_distinct(mojarra$aquario)
```

```
## [1] 97
```

```
## [1] 20
```

---

## Visualizando a estrutura hierárquica

&lt;img src="MATD48-05_files/figure-html/plot-hierarquia-05-1.png" alt="" width="612" /&gt;

Losango preto = média do aquário. Variação **entre** losangos de uma mesma cor = erro
experimental (`\(\sigma_\delta^2\)`); variação dos pontos **ao redor** do seu losango = erro de
amostragem (`\(\sigma_\varepsilon^2\)`). A ANOVA a seguir compara apenas os 20 losangos — não os
quase 100 pontos.

---

## ANOVA aninhada


``` r
modelo_sub &lt;- aov(ganho ~ probiotico + Error(probiotico:aquario), data = mojarra)
summary(modelo_sub)
```

## O diagrama de Hasse do submuestreo

Quatro nós em **cadeia**: aquário aninhado dentro de probiótico, peixe (submuestra) aninhado
dentro de aquário — cada nível de aninhamento é um novo elo, ao contrário dos termos cruzados do
DBCA (Aula 09).

![](../Livro/figuras/hasse/slide-submuestreo.svg)&lt;!-- --&gt;

`\(1+3+16+77=97=N\)`: os 16 gl de "UE" são exatamente os `\(t(r-1)\)` da tabela simbólica; os 77 gl de
"Submuestra" são o que sobra depois de já ter explicado probiótico e aquário — a mesma regra de
subtração do diagrama de Hasse do Cap. 2 do livro-texto.

---

## Efeitos aleatórios: variabilidade entre clipes sonoros

Cinco clipes de som distração sorteados de um banco maior, 8 voluntários por clipe.


``` r
set.seed(77)
t_niveis &lt;- 5; n_por_nivel &lt;- 8
efeito_clipe &lt;- rnorm(t_niveis, 0, sqrt(300))
dados_clipe &lt;- tibble(
  clipe = factor(rep(paste("Clipe", 1:t_niveis), each = n_por_nivel)),
  efeito = rep(efeito_clipe, each = n_por_nivel),
  tempo_reacao = 520 + efeito + rnorm(t_niveis * n_por_nivel, 0, sqrt(1200))
)
modelo_clipe &lt;- aov(tempo_reacao ~ clipe, data = dados_clipe)
tab_cl &lt;- summary(modelo_clipe)[[1]]
sigma2_tau_hat &lt;- (tab_cl[["Mean Sq"]][1] - tab_cl[["Mean Sq"]][2]) / n_por_nivel
c(sigma2_tau = sigma2_tau_hat, sigma2 = tab_cl[["Mean Sq"]][2],
  ICC = sigma2_tau_hat / (sigma2_tau_hat + tab_cl[["Mean Sq"]][2]))
```

```
##   sigma2_tau       sigma2          ICC 
##  242.2223275 1407.0528376    0.1468659
```

## Tamanho de amostra no modelo aleatório


``` r
gamma_alvo &lt;- 300 / 1200
poder_n &lt;- function(n, t = 5, alpha = 0.05) {
  Fc &lt;- qf(1 - alpha, t - 1, t * (n - 1))
  pf(Fc / (1 + n * gamma_alvo), t - 1, t * (n - 1), lower.tail = FALSE)
}
tibble(n = c(8, 15, 20, 30)) %&gt;% mutate(poder = round(map_dbl(n, poder_n), 3)) %&gt;%
  kable(format = "html") %&gt;% kable_styling(font_size = 20, full_width = FALSE)
```

## Resumo da aula

- Submuestreo: modelo com `\(\delta_{ij}\)` (experimental) e `\(\varepsilon_{ijk}\)` (amostragem); o
  teste de tratamento usa o erro experimental, nunca o de amostragem.
- A variância da média de uma UE tem piso `\(\sigma_\delta^2\)`: mais UEs &gt; mais submuestras.
- Efeitos aleatórios: mesma tabela de ANOVA, `\(E[QM]\)` diferente, foco em `\(\sigma_\tau^2\)` (ICC), e
  planejamento amostral via `\(F/(1+n\gamma)\)` em vez de `\(F\)` não central.
- Próxima aula: verificação dos pressupostos (normalidade, homocedasticidade) e transformações
  que tornam essas ANOVAs confiáveis na prática.

---
