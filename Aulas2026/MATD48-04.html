# Aula 04 — Delineamento Completamente Aleatorizado

### Teoria · Aplicação · Discussão · Uso do R

---

class: inverse, center, middle

# Bloco 1 — Teoria

---

## O que esta aula controla (e o que não controla)

O DCA (delineamento completamente aleatorizado) é o experimento controlado **mínimo**: um único sorteio distribui os `\(t\)` tratamentos entre as `\(N\)` unidades experimentais.

- **Controla:** tudo o que distingue as unidades antes do experimento (idade, habilidade, humor, o que for), medido ou não. O sorteio impede que essas características decidam o tratamento.
- **Não controla:** a heterogeneidade entre as unidades, que vai inteira para o erro (a Aula 09 resolve isso com blocos), e o que acontece **depois** do sorteio (a ordem de execução, Aula 06).

Hoje veremos que o próprio teste `\(F\)` é uma consequência do sorteio: a sua distribuição de referência é a dos sorteios possíveis.

---

## O que é um DCA (delineamento completamente aleatorizado)

O **delineamento completamente aleatorizado** é o desenho mais simples que satisfaz os três
pilares da Aula 01:

- `\(t\)` tratamentos e `\(N\)` unidades experimentais **homogêneas** (nada conhecido as distingue de
  antemão: por isso não há blocos);
- decide-se quantas unidades experimentais (UEs) cada tratamento recebe (`\(n_i\)`, repetição);
- **sorteia-se** quais UEs recebem cada tratamento, sem nenhuma restrição (aleatorização
  completa): qualquer das `\(N!/(n_1!\cdots n_t!)\)` alocações é igualmente provável.

--

Exemplo real, que acompanha a aula: 4 fertilizantes, 20 parcelas de feijão, 5 parcelas por
fertilizante. O sorteio, em R, é uma linha:


``` r
set.seed(1); plano &lt;- tibble(parcela = 1:20, fertilizante = sample(rep(paste0("F", 1:4), each = 5)))
head(plano$fertilizante, 8)
```

```
## [1] "F1" "F2" "F1" "F1" "F3" "F4" "F3" "F4"
```

## O modelo do DCA a uma via

`$$Y_{ij} = \mu + \tau_i + \varepsilon_{ij}, \qquad \varepsilon_{ij}\overset{iid}{\sim}N(0,\sigma^2)$$`

(iid = independentes e identicamente distribuídos)

- `\(i = 1,\ldots,t\)` tratamentos (linhas da tabela larga); `\(j = 1,\ldots,n_i\)` repetições
  (colunas); `\(N=\sum_i n_i\)` = número de linhas da planilha longa.
- `\(\mu_i = \mu+\tau_i\)` é a média do tratamento `\(i\)`; `\(\sum_i n_i\tau_i = 0\)`.
- `\(Y_{ij}\)`, `\(\varepsilon_{ij}\)` são aleatórios; `\(\mu,\tau_i\)` são parâmetros fixos. No feijão,
  `\(\tau_4\)` é quanto o F4 rende acima da média geral, e `\(\varepsilon_{4j}\)` é o que a parcela `\(j\)`
  de F4 tem de particular (solo, umidade).

--

Estimadores de mínimos quadrados: `\(\hat\mu_i=\bar Y_{i\cdot}\)`,
`\(\hat\sigma^2=MS_E=\dfrac{1}{N-t}\sum_{i,j}(Y_{ij}-\bar Y_{i\cdot})^2\)`.

---

## O que `\(\mu_i-\mu_k\)` significa causalmente?

`\(\mu_i-\mu_k\)` é apenas um contraste entre parâmetros do modelo — para interpretá-lo como um
**efeito causal**, usamos o arcabouço de resultados potenciais de Neyman e Rubin
(Neyman, 1923; Rubin, 1974; Imbens &amp; Rubin, 2015) (Aula 01) aplicado ao DCA: cada
UE `\(u\)` tem `\(t\)` valores fixos `\(Y_u(1),\ldots,Y_u(t)\)` (um por tratamento, sob **SUTVA**, *stable unit treatment value assumption* — sem
interferência entre UEs, sem versões ocultas de tratamento); só `\(Y_u(T_u)\)` é observado. Estimando
de interesse: `\(\tau_{i,k}=\frac{1}{N}\sum_u[Y_u(i)-Y_u(k)]\)`.

--

**Proposição (Neyman, 1923/1990).** Em um DCA — `\(n_i\)` UEs sorteadas para `\(i\)` por amostragem
aleatória simples —, `\(E\big[\bar Y_i^{\text{obs}}-\bar Y_k^{\text{obs}}\big]=\tau_{i,k}\)`, sem
**nenhuma** suposição distribucional: a esperança é só sobre o sorteio, com os `\(Y_u(i)\)` fixos.

Complementar ao teste de aleatorização: Fisher testa a hipótese aguda `\(Y_u(i)=Y_u(k)\;\forall u\)`;
Neyman estima/testa a hipótese fraca `\(\tau_{i,k}=0\)` (nenhum efeito, *em média*). O que o modelo
`\(Y_{ij}=\mu+\tau_i+\varepsilon_{ij}\)` acrescenta não é a validade do ponto estimado — já garantida
por Neyman — mas distribuições exatas (`\(t\)`, `\(F\)`) em amostra finita para intervalos de confiança (ICs) e testes.

---

## De onde vem a validade de um teste em um experimento?

Sob `\(H_0\)` (tratamento sem efeito), os rótulos de tratamento são **permutáveis** entre as
unidades — foi o sorteio que escolheu uma entre muitas alocações igualmente prováveis.

Um **teste de aleatorização**: reembaralha os rótulos muitas vezes, recalcula a estatística a
cada vez, e o valor-$p$ é a proporção de reembaralhamentos tão extremos quanto o observado.

--

A teoria normal-linear (ANOVA, análise de variância) que vem a seguir é uma **excelente aproximação** a esse teste
exato — sem exigir reembaralhamento computacional (Fisher, 1935; Edgington &amp; Onghena, 2007).

---

## O esquema geral por trás de um teste baseado em simulação

&lt;img src="MATD48-04_files/figure-html/fig-esquema-teste-aleatorizacao-04-1.png" alt="" width="504" /&gt;

Dados → estatística observada; modelo de `\(H_0\)` → dados simulados → distribuição de referência →
valor-$p$. O reembaralhamento de rótulos **é** esse esquema, com o "modelo de `\(H_0\)`" sendo o
próprio mecanismo de aleatorização do delineamento (mesmo diagrama do Cap. 3 do livro-texto).

---

## Mas de onde **vem** esse modelo?

Até aqui o modelo `\(Y_{ij}=\mu+\tau_i+\varepsilon_{ij}\)` foi **postulado**. Num curso de regressão isso basta. Aqui não: nós **sorteamos** as unidades, e o sorteio é nosso. Então o modelo pode ser **deduzido** (Cornfield, 1944; Kempthorne, 1952).

--

Comece pela **população conceitual de respostas**: `\(Y_{ij}\)` = resposta que a unidade `\(j\)` apresentaria sob o tratamento `\(i\)`.

&lt;img src="MATD48-04_files/figure-html/pop-conceitual-1.png" alt="" width="691.2" /&gt;

Verde = o que o sorteio deixou observar. **Uma célula por coluna** — são os resultados potenciais da Aula 01.

---

## A variável de seleção de Cornfield

Falta representar matematicamente **o sorteio**. Seja `\(y_{ir}\)` a resposta da `\(r\)`-ésima réplica do tratamento `\(i\)`, e

`$$\delta_{ir}^{\,j}=\begin{cases}1,&amp;\text{se a réplica } ir \text{ foi aplicada à unidade } j\\ 0,&amp;\text{caso contrário}\end{cases}$$`

--

.pull-left[
Os índices têm papéis diferentes:

- `\(ir\)` = **posição no plano** (2ª réplica de A);
- `\(j\)` = **unidade física** (voluntário nº 5).

A aleatoriedade de `\(\delta\)` não vem da natureza: vem do papelzinho que **nós** sorteamos.
]
.pull-right[
Sob aleatorização completa:

`$$P(\delta_{ir}^{\,j}=1)=\frac1N, \qquad \sum_{j=1}^{N}\delta_{ir}^{\,j}=1$$`

`$$P(\delta_{ir}^{\,j}=1 \mid \delta_{i'r'}^{\,j'}=1)=\frac{1}{N-1}$$`
]

--

**Relação de seleção** — liga o observável ao conceitual: `\(y_{ir}=\sum_{j=1}^{N}\delta_{ir}^{\,j}\,Y_{ij}\)`.

---

## O modelo **deduzido**, não suposto

Identidade algébrica exata da tabela `\(t\times N\)`:

`$$Y_{ij}=\bar Y_{\cdot\cdot}+(\bar Y_{i\cdot}-\bar Y_{\cdot\cdot})+(\bar Y_{\cdot j}-\bar Y_{\cdot\cdot})+\underbrace{(Y_{ij}-\bar Y_{i\cdot}-\bar Y_{\cdot j}+\bar Y_{\cdot\cdot})}_{\text{interação tratamento}\times\text{unidade}}$$`

--

**Aditividade no sentido estrito:** supor o último termo nulo — o efeito de trocar `\(i\)` por `\(k\)` é o mesmo em toda unidade. É uma **suposição**, e é a única aqui.

--

Substituindo na relação de seleção e usando `\(\sum_j\delta_{ir}^{\,j}=1\)`:

`$$y_{ir}=\underbrace{\bar Y_{\cdot\cdot}}_{\mu}+\underbrace{(\bar Y_{i\cdot}-\bar Y_{\cdot\cdot})}_{\tau_i}+\underbrace{\sum_j \delta_{ir}^{\,j}(\bar Y_{\cdot j}-\bar Y_{\cdot\cdot})}_{\omega_{ir}} \;=\; \mu+\tau_i+\omega_{ir}$$`

O modelo do DCA **não foi suposto: foi obtido**, com o `\(\varepsilon_{ij}\)` ganhando um significado concreto: `\(\omega_{ir}\)`, o efeito da unidade que o sorteio pôs naquela posição.

---

## O erro de aleatorização é correlacionado

`\(\omega_{ir}\)` não é ruído abstrato: é o efeito da unidade que o sorteio pôs naquela posição. Com `\(u_j=\bar Y_{\cdot j}-\bar Y_{\cdot\cdot}\)` e `\(\sigma_u^2=\frac{1}{N-1}\sum_j u_j^2\)`:

`$$\mathbb{E}_R(\omega_{ir})=0, \qquad \mathrm{Var}_R(\omega_{ir})=\Big(1-\tfrac1N\Big)\sigma_u^2, \qquad \mathrm{Cov}_R(\omega_{ir},\omega_{i'r'})=-\frac{\sigma_u^2}{N}$$`

--

.pull-left[
A covariância é **negativa** — e por um motivo puramente combinatório: sorteio **sem reposição**. A unidade que caiu numa posição não pode cair em outra.

`$$\mathrm{Var}_R(\boldsymbol\omega)=\mathbf V=\sigma_u^2\Big(\mathbf I_N-\tfrac1N\mathbf J_N\Big)$$`

**não é diagonal** — a hipótese de Gauss-Markov está violada.
]
.pull-right[

E, no entanto, **MQO (mínimos quadrados ordinários) continua BLUE** (melhor estimador linear não viesado) — a condição de Zyskind da Aula 03 se verifica aqui. Correlacionados, sim; mas podemos proceder como se não fossem.

---

## A decomposição da soma de quadrados

Cada desvio em relação à média geral se parte em dois:
`\(\;Y_{ij}-\bar Y_{\cdot\cdot}=\underbrace{(\bar Y_{i\cdot}-\bar Y_{\cdot\cdot})}_{\text{entre tratamentos}}+\underbrace{(Y_{ij}-\bar Y_{i\cdot})}_{\text{dentro do tratamento}}\)`.
Elevando ao quadrado e somando, o termo cruzado se anula (os resíduos somam zero em cada grupo):

`$$\underbrace{\sum_{i,j}(Y_{ij}-\bar Y_{\cdot\cdot})^2}_{SQ_{\text{Total}}}
=\underbrace{\sum_i n_i(\bar Y_{i\cdot}-\bar Y_{\cdot\cdot})^2}_{SQ_{\text{Trat}}}
+\underbrace{\sum_{i,j}(Y_{ij}-\bar Y_{i\cdot})^2}_{SQ_E}$$`

É o Pitágoras da Aula 03: `\(SQ_{\text{Trat}}=\lVert(\mathbf P_X-\mathbf P_{\mathbf 1})\mathbf Y\rVert^2\)`,
`\(SQ_E=\lVert(\mathbf I-\mathbf P_X)\mathbf Y\rVert^2\)`.

--

**Esperanças** (sob o modelo, com `\(\sum_i n_i\tau_i=0\)`):

`$$E[MS_E]=\sigma^2,\qquad E[MS_{\text{Trat}}]=\sigma^2+\frac{\sum_i n_i\tau_i^2}{t-1}$$`

Sob `\(H_0:\tau_i=0\)` as duas esperanças coincidem, e `\(F=MS_{\text{Trat}}/MS_E\)` fica em torno de 1.
Quanto maiores os `\(\tau_i\)`, maior `\(F\)`. É esse raciocínio que a Aula 05 repete com dois níveis de erro.

## Intervalos de confiança

**Média de um tratamento** (`\(100(1-\alpha)\%\)`):

`$$\bar Y_{i\cdot} \pm t_{\alpha/2,\,N-t}\sqrt{MS_E/n_i}$$`

**Diferença entre duas médias**:

`$$(\bar Y_{i\cdot}-\bar Y_{k\cdot}) \pm t_{\alpha/2,\,N-t}\sqrt{MS_E\left(\tfrac{1}{n_i}+\tfrac{1}{n_k}\right)}$$`

Os dois usam o **mesmo** `\(MS_E\)` — a ANOVA combina (*pools*) a variabilidade dos `\(t\)` grupos em uma
única estimativa de `\(\sigma^2\)`.

---

## Notação matricial: o DCA como caso do modelo linear geral

O Capítulo 2 prometeu que `\(\mathbf{Y}=\mathbf{X}\boldsymbol\beta+\boldsymbol\varepsilon\)` reapareceria
aqui. Parametrização de **médias de célula**: `\(t\)` colunas indicadoras (sem intercepto),
`\(\mathbf{X}_{[ij],i'}=\mathbb 1\{i'=i\}\)`, `\(\boldsymbol\beta=(\mu_1,\ldots,\mu_t)'\)` — sem a
restrição `\(\sum_i n_i\tau_i=0\)` que a parametrização `\(\mu+\tau_i\)` exige.

--

Como as colunas de `\(\mathbf X\)` são indicadoras de grupos disjuntos, `\(\mathbf X'\mathbf X= \mathrm{diag}(n_1,\ldots,n_t)\)` — diagonal, posto completo `\(t\)` — logo **todo** `\(\mu_i\)` é trivialmente
estimável (sem contrastes especiais, ao contrário do caso geral do Cap. 2), e

`$$\hat{\boldsymbol\beta}=(\mathbf X'\mathbf X)^{-1}\mathbf X'\mathbf Y=(\bar Y_{1\cdot},\ldots,\bar Y_{t\cdot})',
\qquad \mathrm{Cov}(\hat{\boldsymbol\beta})=\sigma^2\,\mathrm{diag}(1/n_1,\ldots,1/n_t)$$`

Gauss-Markov (Aula 03) se aplica sem qualificações: cada `\(\hat\mu_i=\bar Y_{i\cdot}\)` é BLUE.

## Tempo de reação sob distração

**Pergunta:** nenhuma distração, distração sonora e distração visual diferem quanto ao tempo de
reação (ms) em uma tarefa de decisão simples?

- 36 voluntários, sorteados 12 por condição (**UE = voluntário**, sem subamostragem aqui).
- 1 fator (tipo de distração), 3 níveis, DCA sem blocos.


``` r
set.seed(48)
condicao &lt;- c("Nenhuma", "Sonora", "Visual")
n_por_grupo &lt;- 12
dados_tr &lt;- tibble(
  sujeito  = 1:(3 * n_por_grupo),
  condicao = factor(rep(condicao, each = n_por_grupo), levels = condicao),
  tempo_reacao = c(rnorm(n_por_grupo, 480, 45), rnorm(n_por_grupo, 512, 45),
                    rnorm(n_por_grupo, 555, 45))
)
```

## Quem decidiu a condição de cada voluntário?

**O sorteio:** os 36 voluntários foram divididos 12 a 12 entre as três condições por sorteio, antes de qualquer medida.

**A versão não controlada:** deixar cada voluntário escolher em qual condição quer ser testado, ou usar os registros de um laboratório que testou a condição visual só às sextas à tarde.

- Os mais lentos podem evitar as distrações; o cansaço de sexta à tarde anda junto com a condição visual.
- A ANOVA continuaria saindo, com `\(F\)` e valor-$p$, mas a pergunta respondida passaria a ser "estes grupos de pessoas diferem?", não "a distração tem efeito?". O Bloco 3 mede o tamanho do problema.

---

## Ajustando a ANOVA


``` r
modelo_tr &lt;- aov(tempo_reacao ~ condicao, data = dados_tr)
summary(modelo_tr)
```

```

## Residuals   33  88133    2671                   
## ---
## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1
```

O tipo de distração afeta o tempo de reação médio (`\(p &lt; 0{,}01\)`).

# Bloco 3 — Discussão

---

## Controlado × não controlado

**O `\(F\)` quando ninguém sorteou**

`\(H_0\)` **verdadeira por construção**: a distração não tem efeito. 36 participantes, velocidade basal diferente.
**Controlado:** 12 sorteados por condição. **Não controlado:** cada um escolhe a condição; os mais lentos evitam distração (força `\(\kappa\)`).

&lt;img src="MATD48-04_files/figure-html/cnc-a04-1.png" alt="" width="90%" /&gt;

Cada ponto: 1.000 estudos. Tracejado: os 5% nominais.

---

## Por que o `\(F\)` "descobre" um efeito que não existe


``` r
cnc3 %&gt;% filter(kappa %in% c(0, 0.5, 1, 2)) %&gt;%
  pivot_wider(names_from = regime, values_from = rejeicao)
```

```
## # A tibble: 4 × 3
##   kappa `Controlado: sorteio` `Não controlado: o participante escolhe`
##   &lt;dbl&gt;                 &lt;dbl&gt;                                    &lt;dbl&gt;
## 1   0                   0.052                                    0.052
## 2   0.5                 0.052                                    0.398
## 3   1                   0.038                                    0.868
## 4   2                   0.049                                    0.997
```

- O `\(F\)` não erra a conta: os grupos **diferem mesmo**, porque reúnem **pessoas diferentes**.
- Ele testa "as médias dos grupos são iguais", não "a distração não tem efeito". **Só o sorteio** faz as duas frases coincidirem.
- O valor-$p$ do DCA vem da distribuição sobre **todos os sorteios possíveis** (teste de aleatorização). Sem sorteio, não há referência.

## Perguntas para a turma

1. Os ICs de "Sonora" e "Visual" na figura anterior se sobrepõem parcialmente. Isso já basta para
   concluir que as duas condições não diferem entre si? Por quê?

2. Por que os dois intervalos de confiança da Teoria (média e diferença de médias) usam o mesmo
   `\(MS_E\)`, em vez de cada grupo estimar sua própria variância separadamente?

3. Se o pesquisador tivesse medido o tempo de reação de cada voluntário em **três tentativas**
   (não uma só), o que mudaria no cálculo do `\(N\)` usado na tabela de ANOVA? (dica: Capítulo 1 e
   próxima aula.)

4. O teste de aleatorização da Teoria não pressupõe normalidade. O que a ANOVA "compra" ao
   assumir normalidade, se o teste de aleatorização já é válido sem ela?

# Bloco 4 — Uso do R

---

## Teste de aleatorização vs. teste F


``` r
F_obs &lt;- summary(modelo_tr)[[1]][["F value"]][1]
F_perm &lt;- replicate(2000, {
  rotulo &lt;- sample(dados_tr$condicao)
  summary(aov(dados_tr$tempo_reacao ~ rotulo))[[1]][["F value"]][1]
})
c(p_teorico = pf(F_obs, 2, 33, lower.tail = FALSE), p_aleatorizacao = mean(F_perm &gt;= F_obs))
```

```
##       p_teorico p_aleatorizacao 
##     0.006580317     0.006000000
```

Os dois valores-$p$ ficam próximos: a aproximação normal-linear é razoável aqui.

---

## Número de réplicas necessário


``` r
medias_grupo &lt;- tab_ic$media        # médias observadas (slide de ICs)
f_cohen &lt;- sqrt(mean((medias_grupo - mean(medias_grupo))^2)) / sqrt(MS_E)
f_cohen
```

```
## [1] 0.5711752
```

``` r
pwr::pwr.anova.test(k = 3, f = f_cohen, sig.level = 0.05, power = 0.80)
```

```
## 
##      Balanced one-way analysis of variance power calculation 
## 
##               k = 3
##               n = 10.90754
##               f = 0.5711752
##       sig.level = 0.05
##           power = 0.8
## 
## NOTE: n is number in each group
```

Com o tamanho de efeito observado, ~11 réplicas por grupo bastariam para poder de 80% — as 12
usadas já garantem poder pouco acima disso.

## Resumo da aula

- DCA: `\(t\)` tratamentos sorteados sem restrição entre `\(N\)` UEs homogêneas. Planilha: uma linha por
  UE; a tabela tratamento × réplica guarda medidas, não contagens.
- `\(SQ_{\text{Total}}=SQ_{\text{Trat}}+SQ_E\)`; sob `\(H_0\)`, `\(E[MS_{\text{Trat}}]=E[MS_E]=\sigma^2\)`.
- O teste `\(F\)` da ANOVA aproxima um teste de aleatorização exato, sem exigir reembaralhamento.
- `\(Y_{ij}=\mu+\tau_i+\varepsilon_{ij}\)`: a tabela de ANOVA decompõe `\(SQ_{\text{Total}}\)` em
  tratamento + erro; ICs para médias e diferenças usam o `\(MS_E\)` combinado.
- Número de réplicas: função de `\(\alpha\)`, poder desejado e do `\(f\)` de Cohen (via
  `pwr::pwr.anova.test()`), não há fórmula fechada.
- Próxima aula: o que muda quando há **subamostragem** (mais de uma medição por unidade
  experimental) e quando os "tratamentos" são uma **amostra aleatória** de uma população maior.
- **Controlado × não controlado:** o sorteio do DCA controla tudo o que as unidades trazem de antes, medido ou não. Sem sorteio, o `\(F\)` continua calculável, mas rejeita `\(H_0\)` verdadeira muito além dos 5%.
