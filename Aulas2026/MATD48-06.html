# Aula 06 — Verificação de Pressupostos e Transformações

### Teoria · Aplicação · Discussão · Uso do R

---

class: inverse, center, middle

# Bloco 1 — Teoria

---

## Resíduos: verificação, mas também **descoberta**

Analisar resíduos não é só carimbar pressupostos. É a única parte da análise capaz de revelar que **o delineamento esqueceu um fator**. Quatro coisas se procura (Kempthorne, 1952):

.pull-left[
1. **Evidência contra aditividade** — padrão em funil sugere que a interação ignorada importa.
2. **Evidência contra homocedasticidade** — a variância do erro muda entre tratamentos.
]
.pull-right[
3. **Fontes de variação não controladas** — padrão contra a **ordem de execução** ou contra covariáveis externas (tempo, temperatura, operador) denuncia fator omitido.
4. **Pontos discrepantes** — resíduos grandes que merecem investigação, não descarte automático.
]

--

Os itens 1, 2 e 4 são *verificação*. O **item 3 é descoberta** — e é o mais valioso, porque aponta o que mudar no **próximo** experimento.

---

## O gráfico que 90% das análises esquece: resíduo × ordem de execução

&lt;img src="MATD48-06_files/figure-html/residuo-ordem-1.png" alt="" width="676.8" /&gt;

--

À esquerda, a tendência ascendente grita: existe algo **ligado ao tempo** que o modelo não tem — aqui, o equipamento aquecendo ao longo do dia. Nenhum teste de normalidade ou de Levene detectaria isso; o Q-Q plot ficaria bonito.

À direita, com a ordem no modelo, o padrão desaparece. **A aleatorização protege a validade; o gráfico de ordem revela o que bloquear da próxima vez.**

---

## Três pressupostos, uma checagem possível

A validade dos testes `\(F\)`, ICs e cálculos de tamanho amostral (Aulas 04–05) repousa em:

1. **Independência** — garantida (ou não) pelo desenho; não se verifica nos dados.
2. **Normalidade** dos erros.
3. **Variância constante** entre tratamentos (homocedasticidade).

--

Normalidade e homocedasticidade são checáveis a partir dos **resíduos**
`\(e_{ij} = Y_{ij}-\bar Y_{i\cdot}\)` do modelo ajustado — a checagem de adequação do modelo via
análise de resíduos (Montgomery, 2017).

---

## Normalidade: gráfico e teste

- **Q-Q plot**: quantis amostrais dos resíduos vs. quantis teóricos da normal. Mostra **onde**
  (em qual cauda/região) o desvio ocorre — mais informativo que um único número.
- **Shapiro-Wilk** (Shapiro &amp; Wilk, 1965): teste formal, útil como confirmação, não como árbitro único
  — baixo poder em `\(n\)` pequeno, rejeita quase sempre em `\(n\)` muito grande por desvios sem
  relevância prática.

---

## Homogeneidade de variância

- **Teste de Levene** (Levene, 1960): compara desvios absolutos em torno da **mediana** de cada
  grupo — robusto a não normalidade (preferível ao de Bartlett (1937), sensível a ela).
- Ausência de rejeição **não** é evidência de que a homocedasticidade vale — sobretudo com poucas
  observações por grupo. Inspeção gráfica (resíduos vs. ajustados) continua indispensável.

---

## Transformações usuais

- **Log** (`\(\log Y\)`): variância `\(\propto\)` média$^2$ (erro multiplicativo) — tempos, contagens
  grandes, dados positivos assimétricos à direita.
- **Raiz quadrada** (`\(\sqrt Y\)`, ou `\(\sqrt{Y+1/2}\)`): variância `\(\propto\)` média — contagens.
- **Box-Cox** (Box &amp; Cox, 1964): família `\(Y^{(\lambda)}=(Y^\lambda-1)/\lambda\)` (`\(\log Y\)` se
  `\(\lambda=0\)`); `\(\lambda\)` escolhido maximizando a verossimilhança perfilada do modelo ajustado a
  `\(Y^{(\lambda)}\)` (Box, Hunter &amp; Hunter, 2005).

---

## Pontos discrepantes: quando investigar, não descartar

O item 4 da primeira teoria — "resíduos grandes merecem investigação" — precisa de uma régua.
**Resíduo estudentizado** `\(r_i = e_i / \big(s\sqrt{1-h_{ii}}\big)\)`, com `\(h_{ii}\)` a alavancagem
(diagonal da matriz de projeção `\(\mathbf{P}_X\)`, Capítulo 2): divide o resíduo bruto pelo seu
próprio desvio-padrão, o que o torna comparável entre observações com alavancagens diferentes —
um resíduo bruto grande numa observação de alta alavancagem pode ser menos extremo, em termos
relativos, que um resíduo bruto menor numa observação comum.

--

**Regra prática** (não um teste formal): `\(|r_i|&gt;2\)` merece uma olhada; `\(|r_i|&gt;3\)` merece
investigação séria — de onde veio aquela observação, houve erro de registro, é uma unidade
experimental genuinamente atípica? **Descartar automaticamente** um ponto só porque `\(|r_i|&gt;3\)`
inverte a lógica: o objetivo é entender a causa, não maquiar o ajuste.

---

## Detectando o ponto discrepante em R


``` r
dados_ord &lt;- tibble(ordem = 1:40,
                     trat = factor(rep(c("A","B","C","D"), each = 10)),
                     y = 50 + as.numeric(trat)*2 + rnorm(40, 0, 2))
dados_ord$y[7] &lt;- dados_ord$y[7] + 12   # um ponto discrepante deliberado
mod_ord &lt;- lm(y ~ trat, data = dados_ord)
r_estud &lt;- rstudent(mod_ord)
which(abs(r_estud) &gt; 2)
```

```
## 7 
## 7
```

# Bloco 2 — Aplicação

---

## Tempos de reação heterocedásticos

Tempos de reação: assimétricos à direita, variância cresce com a média (efeito multiplicativo).


``` r
set.seed(1234)
condicao &lt;- c("Nenhuma", "Sonora", "Visual")
n &lt;- 15
media_base &lt;- c(420, 470, 560)
cv &lt;- 0.28
dados_het &lt;- tibble(
  sujeito  = 1:(3 * n),
  condicao = factor(rep(condicao, each = n), levels = condicao),
  tempo    = rep(media_base, each = n) * exp(rnorm(3 * n, 0, cv))
)
modelo_het &lt;- aov(tempo ~ condicao, data = dados_het)
```

---

## Q-Q plot e boxplot dos resíduos, lado a lado

&lt;img src="MATD48-06_files/figure-html/qqplot-06-1.png" alt="" width="612" /&gt;

Pontos acima da reta na cauda superior direita do Q-Q: cauda mais pesada que a normal, o padrão
clássico de assimetria à direita em tempos de reação. O boxplot por condição (à direita) já
antecipa o próximo pressuposto: a altura das caixas cresce de "Nenhuma" para "Visual" — indício
visual de heterocedasticidade, antes mesmo do gráfico de resíduos vs. ajustados a seguir.

---

## Resíduos vs. valores ajustados

&lt;img src="MATD48-06_files/figure-html/resid-fitted-06-1.png" alt="" width="468" /&gt;

O leque se abre da esquerda (ajustado baixo) para a direita (ajustado alto): a dispersão dos
resíduos cresce com a média — a marca de um erro multiplicativo, não aditivo.

---

## Testes formais


``` r
shapiro.test(residuals(modelo_het))
```

```
## 
## 	Shapiro-Wilk normality test
## 
## data:  residuals(modelo_het)
## W = 0.84551, p-value = 2.812e-05
```

``` r
car::leveneTest(tempo ~ condicao, data = dados_het)
```

```
## Levene's Test for Homogeneity of Variance (center = median)
##       Df F value Pr(&gt;F)
## group  2  0.1136 0.8929
##       42
```

Shapiro-Wilk rejeita normalidade (`\(p&lt;0{,}001\)`); Levene não rejeita — mas com `\(n=15\)`/grupo o teste
tem pouco poder, mesmo havendo heterocedasticidade por construção (como o gráfico anterior já
deixava claro visualmente).

---

# Bloco 3 — Discussão

---

## Perguntas para a turma

1. O Q-Q plot mostrou desvio nas caudas, mas o teste de Levene não rejeitou homocedasticidade. Os
   dois diagnósticos se contradizem? Como você reconciliaria essa leitura?

2. Depois de transformar por log, as conclusões devem ser reportadas em qual escala — a
   original (ms) ou a log? O que muda na interpretação de "diferença entre médias"?

3. Em que ponto um pesquisador deveria abandonar a transformação e considerar uma alternativa não
   paramétrica (Kruskal-Wallis, tema da próxima seção do curso), em vez de insistir em uma família
   de potências?

4. Um teste de Shapiro-Wilk com `\(n=500\)` rejeita a normalidade com `\(p&lt;0{,}001\)`, mas o Q-Q plot
   parece quase perfeito. O que fazer?

---

# Bloco 4 — Uso do R

---

## Box-Cox


``` r
bc &lt;- MASS::boxcox(modelo_het, plotit = TRUE, lambda = seq(-2, 2, by = 0.01))
```

&lt;img src="MATD48-06_files/figure-html/boxcox-06-1.png" alt="" width="432" /&gt;

``` r
lambda_otimo &lt;- bc$x[which.max(bc$y)]
lambda_otimo
```

```
## [1] -0.6
```

---

## Depois de transformar (log)


``` r
dados_het &lt;- dados_het %&gt;% mutate(log_tempo = log(tempo))
modelo_log &lt;- aov(log_tempo ~ condicao, data = dados_het)

shapiro.test(residuals(modelo_log))
```

```
## 
## 	Shapiro-Wilk normality test
## 
## data:  residuals(modelo_log)
## W = 0.95569, p-value = 0.08363
```

``` r
car::leveneTest(log_tempo ~ condicao, data = dados_het)
```

```
## Levene's Test for Homogeneity of Variance (center = median)
##       Df F value Pr(&gt;F)
## group  2  0.0259 0.9744
##       42
```

O IC de verossimilhança de `\(\lambda\)` inclui 0: a transformação log, mais interpretável, é
compatível com os dados — e resolve a não normalidade detectada antes.

---

## Antes e depois, lado a lado

&lt;img src="MATD48-06_files/figure-html/antes-depois-06-1.png" alt="" width="648" /&gt;

O leque de dispersão que crescia da esquerda para a direita desaparece à direita: na escala log, a
variabilidade dos resíduos é comparável entre as três condições — sinal visual direto de que a
transformação estabilizou a variância sem distorcer a estrutura de tratamento.

---

## Um resultado limítrofe: revisitando o feijão da Aula 04

Na Aula 04, o Shapiro-Wilk nos resíduos do experimento de fertilizante deu `\(p\approx0{,}046\)` —
"no limiar de `\(0,05\)`", prometemos resolver aqui. Um único teste pontual não é o veredito final.


``` r
feijao &lt;- read_csv("../Livro/data/feijao.csv", show_col_types = FALSE) %&gt;%
  mutate(Fertilizante = factor(Fertilizante, labels = paste0("F", 1:4)))
mod_feijao_06 &lt;- aov(Producao ~ Fertilizante, data = feijao)

bc_feijao &lt;- MASS::boxcox(mod_feijao_06, plotit = FALSE, lambda = seq(-2, 2, by = 0.01))
lambda_feijao &lt;- bc_feijao$x[which.max(bc_feijao$y)]
lambda_feijao
```

```
## [1] 1.71
```

--

`\(\lambda\)` ótimo `\(\approx\)` 1.71 — perto de 1 (nenhuma transformação). O
intervalo de verossimilhança de 95% para `\(\lambda\)` **inclui** 1: Box-Cox, que olha o modelo
inteiro, discorda do veredito pontual do Shapiro-Wilk.

---

## A lição: olhe o intervalo, não só o p-valor pontual

Com `\(n=20\)` (5 por fertilizante), o Shapiro-Wilk tem pouco poder — um `\(p\)` perto de `\(0,05\)` é fácil
de obter por acaso mesmo sob normalidade aproximada. O IC de `\(\lambda\)` responde a uma pergunta
melhor: "existe uma transformação claramente melhor que a escala original?" — aqui, não. **Não
transformar** é a decisão defensável: a ANOVA em Producao já é a análise certa, e complicar a
interpretação com uma transformação desnecessária teria custo (a discussão da Aula 04 sobre
médias por fertilizante fica mais direta na escala original).

---

## Resumo da aula

- Normalidade: Q-Q plot (onde o desvio ocorre) + Shapiro-Wilk (confirmação formal).
- Homocedasticidade: Levene, robusto a não normalidade; ausência de rejeição não é prova de que o
  pressuposto vale, sobretudo em `\(n\)` pequeno.
- Log e raiz quadrada são casos especiais da família Box-Cox; `\(\lambda\)` escolhido por
  verossimilhança perfilada, mas interpretabilidade pode justificar arredondar para 0, 1/2 ou 1.
- Resíduos estudentizados `\(r_i\)` dão uma régua comparável para "resíduo grande" — `\(|r_i|&gt;3\)` pede
  investigação, não descarte automático.
- Um único teste com `\(p\)` perto de `\(0,05\)` não é veredito final, sobretudo em `\(n\)` pequeno: o IC de
  `\(\lambda\)` de Box-Cox pode discordar do Shapiro-Wilk pontual — o feijão da Aula 04 ilustrou isso.
- Isso fecha a primeira metade do Capítulo 3 (DCA). A próxima seção trata de contrastes,
  polinômios ortogonais, comparações múltiplas, ANCOVA e Kruskal-Wallis (Kruskal &amp; Wallis, 1952) —
  quando nem a transformação basta.

---
