# Planos Experimentais com Aleatorização Restrita: Blocos



---
## Planos Experimentais Aleatorizados em Blocos

A descrição de um plano completamente aleatorizado (DIC) ressalta a necessidade de **unidades experimentais homogêneas**. A variância do erro experimental (`\(\sigma^2\)`) será reduzida na medida em que o grau de homogeneidade entre as u.e. seja alto. No entanto, conseguir u.e. com alto grau de homogeneidade não é uma tarefa trivial.

**O Problema:** Em muitas situações, é possível identificar uma **fonte de variação sistemática** (heterogeneidade) entre as unidades.

**A Solução:** Se essa fonte de variação é um **fator de ruído controlável**, podemos usar um **plano aleatorizado em blocos (RCBD)** para reduzir a variância do erro experimental e aumentar a precisão do experimento.

---
### Descrição do Plano (RCBD)
Suponha que `\(N = bt\)` unidades experimentais estejam disponíveis para comparar `t` tratamentos.

**Condições:** É possível identificar, entre as `\(N\)` unidades, `\(b\)` conjuntos (chamados de **blocos**) de `\(t\)` unidades cada, tais que:
i) **Dentro de cada bloco**, as `\(t\)` unidades sejam o mais **homogêneas** possível.
ii) **Entre os blocos**, exista **heterogeneidade**, atribuível a um fator de ruído.

**Procedimento de Aleatorização (Restrita):**
1.  Dentro de cada bloco, os `\(t\)` tratamentos são designados **aleatoriamente** às `\(t\)` unidades experimentais.
2.  Cada tratamento é observado **uma única vez por bloco**.
3.  O processo de aleatorização é empregado **independentemente em cada bloco**.

A estrutura de classificação resultante (`Bloco` x `Tratamento`) é **balanceada**.

Pela descrição do plano, observa-se que o processo de aleatorização envolvido é equivalente à execução de um **Delineamento Completamente Aleatorizado (DIC), sem replicação, independentemente, dentro de cada bloco**.

---
### A Intuição Visual por Trás do Bloqueio

Vamos usar um exemplo clássico para entender a lógica do bloqueio.

**O Problema: Heterogeneidade no Campo**
Imagine um campo agrícola onde queremos testar 3 fertilizantes (A, B, C). O campo não é uniforme; ele possui um **gradiente de fertilidade** (por exemplo, mais umidade ou nutrientes) que aumenta da esquerda para a direita. As áreas à direita são naturalmente mais produtivas.

**Mapa de Calor do Campo (Fonte de Ruído):**
&lt;img src="MATD48-09_files/figure-html/unnamed-chunk-1-1.png" style="display: block; margin: auto;" /&gt;
Se usarmos um Delineamento Completamente Aleatorizado (DIC), por puro azar, o Tratamento A poderia acabar sendo alocado principalmente na área menos fértil e o Tratamento C na mais fértil. Concluiríamos erroneamente que C é melhor que A, quando na verdade a diferença é apenas a posição no campo. **O efeito do tratamento estaria confundido com o efeito do gradiente.**

---
### A Solução: Delineamento em Blocos (RCBD)

Para neutralizar o efeito do gradiente, aplicamos a técnica de bloqueio.

**Procedimento:**
1.  **Criar Blocos:** Dividimos o campo em faixas **perpendiculares** ao gradiente. Cada faixa (bloco) é mais homogênea internamente do que o campo como um todo.
2.  **Aleatorizar Dentro dos Blocos:** Em cada bloco, sorteamos os 3 tratamentos (A, B, C) para as 3 parcelas disponíveis.

**Visualização do Plano Aleatorizado em Blocos:**

``` r
# Definir blocos e tratamentos
blocos &lt;- rep(1:4, each = 3)
tratamentos_aleatorizados &lt;- c(sample(c("A","B","C")), sample(c("A","B","C")), 
                               sample(c("A","B","C")), sample(c("A","B","C")))
campo_grid$Bloco &lt;- factor(blocos)
campo_grid$Tratamento &lt;- factor(tratamentos_aleatorizados)
```

---
&lt;img src="MATD48-09_files/figure-html/unnamed-chunk-3-1.png" style="display: block; margin: auto;" /&gt;

**Por que isso funciona?**
Este delineamento garante que **cada tratamento (A, B e C) seja testado uma vez em cada nível de fertilidade** (em cada bloco). A comparação entre A, B e C dentro do Bloco 1 é justa. A comparação dentro do Bloco 4 também é justa. Ao combinar as informações de todos os blocos na ANOVA, o modelo `Resposta ~ Bloco + Tratamento` consegue:
1.  Estimar e **isolar** o efeito do gradiente (a variação entre os blocos).
2.  Fornecer uma estimativa **não-viesada** do efeito dos tratamentos, "limpa" da influência do gradiente de fertilidade.


---
### População Conceitual de Respostas Revisitada (RCBD)

Defina `\(Y_{ijk}\)` como o valor observado (potencial) da variável resposta `\(Y\)` referente ao efeito do `\(k\)`-ésimo tratamento aplicado à `\(j\)`-ésima unidade experimental do bloco `\(i\)`.
Aqui, `\(i = 1, ..., b\)` (índice para blocos), `\(j = 1, ..., t\)` (índice para unidades experimentais dentro de um bloco) e `\(k = 1, ..., t\)` (índice para tratamentos)

---
### Identidade Algébrica e Suposição de Aditividade

A identidade algébrica associada à estrutura da população conceitual do Delineamento em Blocos (Figura 8) é dada pela decomposição completa de uma observação potencial `\(Y_{ijk}\)`:

`$$\begin{aligned}Y_{ijk} = &amp; \bar{Y}_{...} + (\bar{Y}_{i..} - \bar{Y}_{...}) + (\bar{Y}_{..k} - \bar{Y}_{...}) \\ &amp;+ (\bar{Y}_{i.k} - \bar{Y}_{i..} - \bar{Y}_{..k} + \bar{Y}_{...}) + (\bar{Y}_{ij.} - \bar{Y}_{i..}) \\ &amp;+ (Y_{ijk} - \bar{Y}_{i.k} - \bar{Y}_{ij.} + \bar{Y}_{i..})\end{aligned}$$`

**Componentes da Identidade:**
1.  `\(\bar{Y}_{...}\)` : Média Geral
2.  `\((\bar{Y}_{i..} - \bar{Y}_{...})\)` : Efeito Principal do **Bloco `i`**
3.  `\((\bar{Y}_{..k} - \bar{Y}_{...})\)` : Efeito Principal do **Tratamento `k`**
4.  `\((\bar{Y}_{i.k} - \dots)\)` : Efeito da **Interação Bloco x Tratamento**
5.  `\((\bar{Y}_{ij.} - \bar{Y}_{i..})\)` : Efeito da **Unidade Experimental `j` aninhada no Bloco `i`**
6.  `\((Y_{ijk} - \dots)\)` : Efeito da **Interação de 3ª ordem (Bloco x UE x Tratamento)**, ou erro.

---
### Suposição de Aditividade no Sentido Estrito


Para a análise padrão de um RCBD, a suposição fundamental de **aditividade no sentido estrito** é lançada. Por ela, admite-se que os efeitos de interação sejam negligíveis.

**Quais termos são anulados?**

-   **O quarto termo (Interação Bloco x Tratamento):**
    `\((\bar{Y}_{i.k} - \bar{Y}_{i..} - \bar{Y}_{..k} + \bar{Y}_{...}) \rightarrow 0.\)` Isso significa que assumimos que o efeito de um tratamento é o mesmo em todos os blocos. Esta é a suposição mais forte e a que é testada pelo Teste de Não-Aditividade de Tukey.

-   **O sexto termo (Interação de 3ª ordem):**
    `\(Y_{ijk} - \bar{Y}_{i.k} - \bar{Y}_{ij.} + \bar{Y}_{i..}) \rightarrow 0.\)` Assumimos que esta variação de ordem superior é zero e ela se torna parte do erro aleatório.

Com a anulação desses dois termos, a identidade acima é reescrita como:
`$$Y_{ijk} = \bar{Y}_{...} + (\bar{Y}_{i..} - \bar{Y}_{...}) + (\bar{Y}_{..k} - \bar{Y}_{...}) + (\bar{Y}_{ij.} - \bar{Y}_{i..}) \quad (1)$$`
Esta equação (1) é a base para a dedução do modelo linear para o Delineamento em Blocos.

---
### O Modelo Linear Deduzido


Seguindo passos similares aos do DIC (usando uma variável de seleção `\(\delta_{ij}^k=\mathbb{I}(y_{ik}=Y_{ijk})\)`), é possível escrever
`$$y_{ik}=\sum_j\delta_{ij}^kY_{ijk}. \quad (2)$$` agora, substituindo
na equação (2) pelo valor da identidade (1), tem-se
`$$y_{ik} =  \bar{Y}_{...} + (\bar{Y}_{i..} - \bar{Y}_{...}) + (\bar{Y}_{..k} - \bar{Y}_{...})+\sum_j\delta_{ij}^k(\bar{Y}_{ij.} - \bar{Y}_{i..}).$$`


Adotando uma notação mais usual, a equação da identidade leva ao modelo:
`$$y_{ik} = \mu + \beta_i + \tau_k + \omega_{ik} \quad$$`
- `\(y_{ik}\)` é a resposta observada ao tratamento `k` no bloco `i`.
- `\(\mu\)` é a média geral.
- `\(\beta_i\)` é o efeito (fixo) do bloco `i`.
- `\(\tau_k\)` é o efeito (fixo) do tratamento `k`.
- `\(\omega_{ik}\)` é o termo de erro, que combina o efeito da unidade experimental com o erro de medição.

---
As propriedades do termo aleatório `\(\omega_{ik}\)`
são derivadas a partir da sua estrutura
conhecida, da mesma forma como foi
mostrado para o experimento
completamente aleatorizado (ver
Hinkelmann e Kempthorne, pág.253).
Desenvolvendo os cálculos pertinentes,
será possível ainda verificar que a
condição do teorema de Zyskind é
satisfeita para um plano aleatorizado
em blocos, i.e.  pode-se mostrar que o estimador OLS ainda é BLUE. 
 Dessa forma, é possível
incorporar fontes de aleatoriedade ao
modelo - devido por exemplo a erros de
medida - além daquela induzida pelo
processo físico de aleatorização
(refletida pelo termo `\(\omega_{ik}\)` ), implicando
na seguinte representação:
`$$y_{ik} = \mu + \beta_i + \tau_k + \epsilon_{ik} \quad (3)$$`
Com as premissas (parcialmente deduzidas, parcialmente assumidas):
- `\(E(\epsilon_{ik}) = 0\)`
- `\(Var(\epsilon_{ik}) = \sigma^2\)`
- `\(Cov(\epsilon_{ik}, \epsilon_{i'k'}) = 0\)` para `\(i \neq i'\)` ou `\(k \neq k'\)` (erros não correlacionados).

---
### Análise de Variância (ANOVA) para o RCBD

A ANOVA para um RCBD baseia-se no modelo (3). A estrutura de classificação da **amostra** observada é a de dois fatores cruzados (`Bloco` e `Tratamento`), como apresentado no seguinte diagrama de Hasse:

<script type="application/json" data-for="htmlwidget-3c30fd6b972e12ccd388">{"x":{"diagram":"\ndigraph { \nrankdir=TB; \nnode[shape=circle,style=filled,fillcolor=lightblue]; \nedge[arrowhead=none];\nmu[label=\"μ\"]; \nB[label=\"B\"]; \nT[label=\"T\"]; \nepsilon[label=\"ε\"];\nmu -> {B, T}; \n{B, T} -> epsilon; \n{rank=same; B; T;}\n}","config":{"engine":"dot","options":null}},"evals":[],"jsHooks":[]}</script>



A **identidade algébrica** associada a esta estrutura é:
`$$y_{ik} = \bar{y}_{..} + (\bar{y}_{i.} - \bar{y}_{..}) + (\bar{y}_{.k} - \bar{y}_{..}) + (y_{ik} - \bar{y}_{i.} - \bar{y}_{.k} + \bar{y}_{..})$$`

Elevando ao quadrado e somando, os termos cruzados se anulam, resultando na **partição da Soma de Quadrados**:
`$$SQ_{Total} = SQ_{Bloco} + SQ_{Tratamento} + SQ_{Resíduo}$$`

---
### Tabela ANOVA para o RCBD

O quadro a seguir apresenta as informações para uma ANOVA de um RCBD.

| Fonte | G.L. | S.Q. | E(QM) |
|:---|:---:|:---:|:---:|
| Bloco | `\(b-1\)` | `\(t\sum_i(\bar{y}_{i.}-\bar{y}_{..})^2\)` | `\(g(\sigma^2) + \frac{t}{b-1}\sum_{i=1}^t\beta_i^2\)` |
| Trat. | `\(t-1\)` | `\(b\sum_k(\bar{y}_{.k}-\bar{y}_{..})^2\)` | `\(\sigma^2 + \frac{b}{t-1}\sum_{k=1}^t\tau_k^2\)` |
| Resíduo| `\((b-1)(t-1)\)` | `\(\sum_{ik}(y_{ik}-\bar{y}_{i.}-\bar{y}_{.k}+\bar{y}_{..})^2\)`| `\(\sigma^2\)` |
| Total | `\(bt-1\)` | `\(\sum_{ik}(y_{ik}-\bar{y}_{..})^2\)` | |

**Comentário:**
Observando a coluna do valore esperado dos quadrados médios E(QM), percebe-se que, num plano aleatorizado em blocos (com blocos fixos), **não há um teste F definido para a fonte de variação devido a blocos**, pois não há um denominador apropriado com esperança `\(g(\sigma^2)\)`. Isso não é um problema, pois o objetivo do bloqueio não é testar o efeito do bloco, mas sim **removê-lo da variância do resíduo**.

---
### Análise de um Experimento RCBD

Utilizando a estatística:
`$$F = \frac{QM_{Trat}}{QM_{Resid}}$$`
como critério para o teste de igualdade de efeito dos tratamentos (`\(H_0: \tau_1 = ... = \tau_t = 0\)`), a distribuição `\(F_{(t-1), (b-1)(t-1)}\)` é utilizada como uma aproximação da distribuição de referência gerada pela aleatorização.

---
### Eficiência Relativa de um Plano em Blocos

O bloqueio valeu a pena? Para comparar a eficiência de um RCBD (`\(D_1\)`) com a de um DIC (`\(D_2\)`) que poderia ter sido usado, Yates (1935) propôs a **Eficiência Relativa (ER)**.

A estimativa da eficiência relativa é dada por:
`$$\hat{ER}(D_1, D_2) = \frac{(b-1)QM_{Bloco} + b(t-1)QM_{Resid}}{(bt-1)QM_{Resid}}$$`
Suponha que `\(\hat{ER}(D_1, D_2)=a\)`. Tem-se
então, como interpretação prática, que
se o mesmo material experimental
tivesse sido usado em um plano
completamente aleatorizado, teriam
sido necessárias `\(r=ba\)`
réplicas para atingir a mesma eficiência
do plano aleatorizado em blocos
executado.

**Interpretação:** Se `\(\hat{ER} = 1.25\)` (ou 125%), isso significa que um DIC precisaria de **25% mais réplicas** para atingir a mesma precisão (mesma variância para a estimativa de um contraste) que o RCBD executado.
É comum considerar o uso de blocos como efetivo quando `\(\hat{ER}\)` é superior a 125%.

---
### Checando Não-aditividade: O Teste de Tukey

A análise padrão do RCBD assume **aditividade**, ou seja, que a interação Bloco x Tratamento é nula. A violação desta premissa invalida o teste F.

**O Teste de Tukey para Não-Aditividade (1949)** propõe um teste para esta hipótese.
- **Hipótese:** `\(H_0\)`: O modelo é aditivo vs. `\(H_1\)`: O modelo possui um componente de interação multiplicativo.
- **Lógica:** O teste aloca **1 grau de liberdade** da Soma de Quadrados do Resíduo para testar especificamente um tipo de interação multiplicativa.

**Algoritmo:**
1. Ajuste o modelo aditivo `\(y_{ik} = \mu + \beta_i + \tau_k + \epsilon_{ik}\)` e obtenha os resíduos (`\(r\)`) e os valores ajustados (`\(p\)`).
2. Crie uma nova variável com os quadrados dos valores ajustados: `\(p2 = p^2\)`.
3. Ajuste um modelo auxiliar dos resíduos de p2: `\(r_2 = p2 - (\hat{\mu}^* + \hat{\beta}_i^* + \hat{\tau}_k^*)\)`.
4. Ajuste uma regressão dos resíduos originais (`\(r\)`) contra os resíduos do passo 3 (`\(r_2\)`): `\(r_{ik} = \gamma \cdot r2_{ik} + e_{ik}\)`.
5. A Soma de Quadrados para "Não-aditividade" é a SQ da Regressão deste último modelo. O teste F para `\(\gamma=0\)` é o teste de Tukey.

---
### Exemplo Prático: Teste de Tukey para Não-Aditividade 

Vamos aplicar o Teste de Tukey seguindo o algoritmo proposto. John e Quenoulli (1977) descrevem um
estudo sobre o efeito de diferentes
níveis de aplicação de K20 na a
resistência de algodão, medida pelo
índice de Pressley. 
**Cenário:** Efeito de 5 níveis de K2O (`Trat`) na resistência de algodão, em 3 `Blocos`.


``` r
# Dados no formato longo
dados_k2o &lt;- data.frame(
  Resistencia = c(7.62, 8.14, 7.76, 7.17, 7.46, 8.00, 8.15, 7.73, 7.57, 7.68, 7.93, 7.87, 7.74, 7.80, 7.21),
  Bloco = factor(rep(1:3, each = 5)),
  Trat = factor(rep(1:5, times = 3))
)
```

**Passo 1: Ajuste o modelo aditivo e calcule seus resíduos (r) e valores ajustados (p).**

``` r
# Ajustar o modelo aditivo original
modelo_aditivo &lt;- lm(Resistencia ~ Bloco + Trat, data = dados_k2o)
residuos_r &lt;- residuals(modelo_aditivo)
ajustados_p &lt;- fitted(modelo_aditivo)
```

---

``` r
anova(modelo_aditivo)
```

```
## Analysis of Variance Table
## 
## Response: Resistencia
##           Df  Sum Sq  Mean Sq F value  Pr(&gt;F)  
## Bloco      2 0.09712 0.048560  1.1116 0.37499  
## Trat       4 0.73244 0.183110  4.1916 0.04037 *
## Residuals  8 0.34948 0.043685                  
## ---
## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1
```

**Passo 2: Obtenha os quadrados dos valores ajustados: p2 = p².**

``` r
ajustados_p2 &lt;- ajustados_p^2
```

**Passo 3: Ajuste o modelo aditivo aos quadrados dos valores ajustados (`p2`) e calcule seus resíduos (`r2`).**

``` r
# Ajustar o modelo auxiliar
modelo_auxiliar &lt;- lm(ajustados_p2 ~ Bloco + Trat, data = dados_k2o)
residuos_r2 &lt;- residuals(modelo_auxiliar)
```
**Intuição:** O vetor `r2` representa a parte da "curvatura" dos valores ajustados que não pode ser explicada por simples efeitos aditivos de bloco e tratamento. Ele captura a essência da interação.

---
**Passo 4: Ajuste o modelo de regressão dos resíduos originais (`r`) contra os resíduos do passo 3 (`r2`) e observe o teste para `\(\gamma=0\)`.**
O modelo é `\(E(r_{ik}) = \gamma \cdot r2_{ik}\)`. A Soma de Quadrados da Regressão para `\(\gamma\)` é a Soma de Quadrados para Não-Aditividade.

``` r
# Ajustar o modelo final (regressão sem intercepto)
modelo_tukey &lt;- lm(residuos_r ~ 0 + residuos_r2)
# A tabela ANOVA deste modelo nos dará o teste que queremos
anova(modelo_tukey)
```

```
## Analysis of Variance Table
## 
## Response: residuos_r
##             Df  Sum Sq  Mean Sq F value Pr(&gt;F)
## residuos_r2  1 0.01419 0.014190  0.5925 0.4542
## Residuals   14 0.33529 0.023949
```

### Interpretando o Resultado do Algoritmo

**Interpretação:**
- A linha `residuos_r2` corresponde ao teste da hipótese `\(H_0: \gamma = 0\)`.
- A **Soma de Quadrados** para este termo é **0.014190**. Este é o valor da "Soma de Quadrados para Não-Aditividade".
- O **p-valor (Pr(&gt;F))** é **0.4542**.

---
**Conclusão Final:**
Como o p-valor (0.4542) é muito grande, **não rejeitamos a hipótese nula** de que `\(\gamma=0\)`. Isso significa que não há evidência de uma interação multiplicativa. A suposição de aditividade do modelo original é considerada válida.

**Incorporando à Tabela de ANOVA Original:**
Podemos construir a tabela final manualmente:
- SQ Erro Original: 0.34948 (com 8 G.L.)
- SQ Não-Aditividade: 0.01419 (com 1 G.L.)
- SQ Resto: `\(0.34948 - 0.01419 = 0.33529\)` (com `\(8-1=7\)` G.L.)
- Teste F para Não-Aditividade: `\(F = \frac{0.01419 / 1}{0.33529 / 7} = \frac{0.01419}{0.0479} \approx 0.30\)`, com p-valor = 0.59.

### Teste de Tukey para Não-Aditividade usando o pacote `additivityTests` 


``` r
# Inserir os dados no formato longo (padrão tidyverse)
dados_k2o_longo &lt;- data.frame(
  Resistencia = c(7.62, 8.14, 7.76, 7.17, 7.46, 8.00, 8.15, 7.73, 7.57, 7.68,
                  7.93, 7.87, 7.74, 7.80, 7.21),
  Bloco = factor(rep(1:3, each = 5)), Trat = factor(rep(1:5, times = 3))
)
```

**Realizando o Teste com `additivityTests::tukey.test()` :**
A função `tukey.test()` deste pacote requer que os dados estejam em um formato de **matriz**, onde as linhas representam os blocos e as colunas representam os tratamentos.

**Passo 1: Transformar os dados para o formato de matriz.**

``` r
# Usando a função xtabs para criar a tabela/matriz
dados_k2o_matriz &lt;- xtabs(Resistencia ~ Bloco + Trat, data = dados_k2o_longo)

### Teste de Tukey para Não-Aditividade usando o pacote `agricolae`

``` r
library(agricolae)
model&lt;-lm(Resistencia ~ Bloco + Trat,dados_k2o_longo)
df&lt;-df.residual(model)
MSerror&lt;-deviance(model)/df
analysis&lt;-with(dados_k2o_longo,nonadditivity(Resistencia, Bloco, Trat, df, MSerror))#&gt; 
```

```
## 
## Tukey's test of nonadditivity
## Resistencia 
## 
## P : -0.01640661
## Q : 0.01896922 
## 
## Analysis of Variance Table
## 
## Response: residual
##               Df  Sum Sq  Mean Sq F value Pr(&gt;F)
## Nonadditivity  1 0.01419 0.014190  0.2963 0.6031
## Residuals      7 0.33529 0.047899
```



---
- A linha `Residuals` (Erro) tem **8 G.L.** e uma Soma de Quadrados (`Sum Sq`) de **0.34948**.

**2. Resultados do Teste de Não-Aditividade:**
O teste nos disse que a parte da variação do erro atribuível à não-aditividade tem **1 G.L.** e uma Soma de Quadrados de **0.01419**.

**3. Construindo a Tabela Final:**
A nova tabela mantém as linhas `Bloco` e `Trat` e divide a linha `Residuals`.

| Fonte | DF | Sum Sq | Mean Sq | F value | Pr(&gt;F) |
|:---|:---:|:---:|:---:|:---:|:---:|
| Bloco | 2 | 0.09712 | 0.04856 | 1.11 | 0.375 |
| Trat | 4 | 0.73244 | 0.18311 | 4.19 | 0.040 |
| **Error (Original)** | **8** | **0.34948** | **0.04368** | | |
|  *Não-aditividade* | *1* | *0.01419* | *0.01419* | *0.30* | *0.601* |
|  *Resto* | *7* | *0.33529* | *0.04790* | | |
| Total | 14 | 1.17904 | | | |

---
**Como os valores foram calculados:**
- **DF Resto:** `\(8 - 1 = 7\)`
- **Sum Sq Resto:** `\(0.34948 - 0.01419 = 0.33529\)`
- **Mean Sq Resto:** `\(0.33529 / 7 = 0.04790\)`
- **F value Não-adit:** `\(\frac{MS_{Nao-adit}}{MS_{Resto}} = \frac{0.01419}{0.04790} \approx 0.30\)`
- **p-valor (0.601):** `1 - pf(0.30, 1, 7)`

**Nota:** Não existe uma função no `R` para juntar as tabelas de anovas. A construção da tabela final é uma consequência da teoria da partição da Soma de Quadrados, e o pacote `additivityTests` ou `agricolae` que a apresenta de forma conveniente.

**Conclusão:** Como o p-valor (0.592) é muito maior que 0.05, **não há evidência para rejeitar a hipótese nula de aditividade**. A suposição do modelo (`Resistencia ~ Bloco + Trat`) é válida

### Exemplo: Eficiência Relativa do Experimento K2O

Vamos aproveitar a oportunidade e calcular a eficiência relativa estimada do plano aleatorizado em blocos para o experimento do K2O e resistência do algodão.

**Resultados da ANOVA que precisamos:**
- Blocos: `b = 3`
- Tratamentos: `t = 5`
- `\(QM_{Bloco} = 0.04856\)`
- `\(QM_{Resid} = 0.04368\)` (Este é o `\(QM_{Error}\)` do modelo aditivo)

**Cálculo:**
`$$\hat{ER} = \frac{(3-1)(0.04856) + 3(5-1)(0.04368)}{(3 \times 5 - 1)(0.04368)}  = \frac{0.62128}{0.61152} \approx 1.016$$`

**Conclusão:**
A eficiência relativa estimada foi de **101.6%**. Isso indica que **não houve ganho considerável** em termos de redução do erro experimental ao "controlar" os efeitos do fator que define os blocos neste experimento. Um Delineamento Completamente Aleatorizado com 3 réplicas teria sido quase tão eficiente quanto o Delineamento em Blocos com 3 blocos. Neste caso específico, o esforço de bloquear não trouxe um grande benefício em precisão.
