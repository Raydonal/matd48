<!-- Rodape de direitos autorais em toda pagina do gitbook. O gitbook troca o conteudo
     da pagina sem recarregar ao navegar, por isso o rodape e reinserido a cada troca. -->
<script>
(function () {
  var TEXTO = '© 2026 Raydonal Ospina Martínez — Departamento de Estatística, UFBA. ' +
    '<strong>Versão preliminar, em construção.</strong> Uso exclusivo dos estudantes de MATD48; ' +
    'reprodução, distribuição ou uso sem citação proibidos sem autorização do autor (Lei nº 9.610/1998).';
  function poe() {
    var alvo = document.querySelector('.page-inner section.normal');
    if (!alvo || alvo.querySelector('.aviso-rodape')) return;
    var d = document.createElement('div');
    d.className = 'aviso-rodape'; d.innerHTML = TEXTO; alvo.appendChild(d);
  }
  // o gitbook rotula a bibliografia de cada pagina como "References"; em portugues.
  // (reference-section-title no YAML quebra o split_chapters do bookdown.)
  function traduz() {
    document.querySelectorAll('.page-inner h1, .page-inner h2, .page-inner h3').forEach(function (h) {
      if (h.textContent.trim() === 'References') h.textContent = 'Referências';
    });
  }
  document.addEventListener('DOMContentLoaded', function () { poe(); traduz(); });
  if (window.gitbook && gitbook.events) gitbook.events.bind('page.change', function () { poe(); traduz(); });
})();
</script>
